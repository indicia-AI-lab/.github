name: Release

# Indicia standard release: tag -> checks -> image on GHCR (amd64, GitHub-hosted)
# -> Trivy scan of the pushed digest -> Dokploy webhook -> nuclei check of the live URL.
#   X.Y.Z      -> environment production, tag must be on the default branch, image :X.Y.Z + :latest
#   X.Y.Z-rc.N -> environment acceptance, any branch, image :X.Y.Z-rc.N + :acc
# Only `release` can create X.Y.Z tags; `developers` and `release` can create -rc tags (org rulesets).
# Repo setup:
#   - environments `acceptance` and `production`, deployment policy "selected branches and tags",
#     tags only (acceptance: `*-rc*`, production: `[0-9]*`)
#   - per environment: secret DOKPLOY_WEBHOOK_URL, variable LIVE_URL (e.g. https://app.test.indicia-ai.com)
#     More than one Dokploy app (e.g. frontend + backend): secret DOKPLOY_WEBHOOK_URLS instead, one URL
#     per line, fired in that order. Any failing webhook fails the job. DOKPLOY_WEBHOOK_URLS wins when both are set.
#   - Dokploy apps: acc on the test VPS pulling :acc, prod on the prod VPS pulling :latest
#   - org custom property `deploy_target` (prod-vps, test-vps, mac-mini, none)
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions: {}

concurrency:
  group: release-${{ contains(github.ref_name, '-rc.') && 'acceptance' || 'production' }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      environment: ${{ contains(github.ref_name, '-rc.') && 'acceptance' || 'production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Production tag must be on the default branch
        if: ${{ !contains(github.ref_name, '-rc.') }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" || { echo "::error::Tag $GITHUB_REF_NAME is not on $DEFAULT_BRANCH"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck --if-present
      - run: npm test --if-present

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        run: echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ needs.checks.outputs.environment == 'acceptance' && 'acc' || 'latest' }}
      - id: ref
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "image=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Trivy scan of the pushed image
        env:
          REF: ${{ steps.ref.outputs.image }}
          TRIVY_VERSION: 0.76.1
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c - && tar -xzf trivy.tgz trivy
          ./trivy image --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$REF"

  deploy:
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    environment: ${{ needs.checks.outputs.environment }}
    outputs:
      live_url: ${{ steps.live.outputs.url }}
    steps:
      - name: Dokploy webhook(s)
        env:
          WEBHOOKS: ${{ secrets.DOKPLOY_WEBHOOK_URLS }}
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          urls="${WEBHOOKS:-$WEBHOOK}"
          n=0
          while IFS= read -r url || [ -n "$url" ]; do
            url="$(printf '%s' "$url" | tr -d '[:space:]')"
            [ -n "$url" ] || continue
            n=$((n + 1))
            echo "Webhook $n"
            curl -fsS --retry 3 --retry-delay 5 -X POST "$url" -o /dev/null \
              || { echo "::error::Dokploy webhook $n failed"; exit 1; }
          done <<< "$urls"
          [ "$n" -gt 0 ] || { echo "::error::Neither DOKPLOY_WEBHOOK_URLS nor DOKPLOY_WEBHOOK_URL is set in this environment"; exit 1; }
      # A reusable-workflow job cannot use an environment, so hand the environment's LIVE_URL on.
      - id: live
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: echo "url=${LIVE_URL}" >> "$GITHUB_OUTPUT"

  # Verify the deployed revision yourself as well: a green webhook only means Dokploy accepted the request.
  smoke:
    needs: deploy
    if: needs.deploy.outputs.live_url != ''
    permissions:
      contents: read
    uses: indicia-AI-lab/.github/.github/workflows/nuclei.yml@5d654423d6835242390e6b33d1a520efd187ca45 # v1.0.2
    with:
      url: ${{ needs.deploy.outputs.live_url }}
