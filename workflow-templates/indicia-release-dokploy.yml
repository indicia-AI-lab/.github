name: Release

# Indicia standard release via indicia-AI-lab/.github (release-dokploy.yml). Change it there and bump the ref.
#   X.Y.Z      -> environment production, tag must be on the default branch, image :X.Y.Z + :latest
#   X.Y.Z-rc.N -> environment acceptance, any branch, image :X.Y.Z-rc.N + :acc
# A prod tag on a commit with a green rc build reuses that image (fresh Trivy scan, no rebuild).
# Only `release` can create X.Y.Z tags; `developers` and `release` can create -rc tags (org rulesets).
# Repo setup:
#   - environments `acceptance` (tags `*-rc*`) and `production` (tags `[0-9]*`)
#   - per environment: secret DOKPLOY_WEBHOOK_URLS (one URL per line, fired in order) or DOKPLOY_WEBHOOK_URL,
#     variable LIVE_URL (nuclei smoke check after the deploy)
#   - Dokploy apps: acc on the test VPS pulling :acc, prod on the prod VPS pulling :latest
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions: {}

# One deploy at a time; never cancel an in-flight deploy.
concurrency:
  group: release-${{ contains(github.ref_name, '-rc.') && 'acceptance' || 'production' }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: read
      actions: read
      packages: write
    uses: indicia-AI-lab/.github/.github/workflows/release-dokploy.yml@c3b49a10a656b6cbd8fcc5872e7a4ffc1dced727 # v1.1.0
    # Environment secrets (DOKPLOY_WEBHOOK_URL[S]) reach the reusable deploy job only via inherit;
    # the reusable workflow is our own, pinned by SHA.
    # nosemgrep: yaml.github-actions.security.secrets-inherit.secrets-inherit -- environment secrets, own pinned workflow
    secrets: inherit # zizmor: ignore[secrets-inherit]
    # with:
    #   node-version: "24.22.1"     # or the default node-version-file: .node-version
    #   checks: false               # no package.json (static site)
    #   context: .                  # dockerfile, target, platforms (linux/amd64), build-args
    #   image-smoke-script: .github/scripts/image-smoke.sh
