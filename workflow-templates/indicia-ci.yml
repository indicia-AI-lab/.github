name: CI

# Indicia standard: the checks live in indicia-AI-lab/.github (ci-node.yml). Change them there and bump the ref
# (Dependabot github-actions does that). Repo-specific: node version, package manager, scripts, db-image.
# The org also runs the required `security` workflow on every pull request; you do not need to add it here.
on:
  pull_request:
  push:
    branches: [$default-branch]

permissions: {}

# A newer push to the same PR or branch cancels the older run. Never copy this into tag or deploy workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
    uses: indicia-AI-lab/.github/.github/workflows/ci-node.yml@c3b49a10a656b6cbd8fcc5872e7a4ffc1dced727 # v1.1.0
    # with:
    #   node-version: "24.22.1"        # or keep the default node-version-file: .node-version
    #   package-manager: pnpm          # npm (default), pnpm, bun
    #   scripts: lint typecheck test   # package.json scripts that exist are run in this order
    #   db-image: postgres:18.6-alpine@sha256:...   # Postgres service, DATABASE_URL is set
