name: CI

# Indicia standard: the checks live in indicia-AI-lab/.github (ci-node.yml), referenced on @main: a change there
# applies to every repo at once. Repo-specific: node version, package manager, scripts.
# PR CI is the fast check only (install with cache, lint, typecheck, unit tests). e2e, DB tests, Docker build,
# Trivy and image smoke run in the release workflow on rc and X.Y.Z tags.
# The org also runs the required `security` workflow on every pull request; you do not need to add it here.
# No push trigger on the default branch: the PR run already checked that code.
on:
  pull_request:
  workflow_dispatch:

permissions: {}

# A newer push to the same PR or branch cancels the older run. Never copy this into tag or deploy workflows.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
    uses: indicia-AI-lab/.github/.github/workflows/ci-node.yml@main # zizmor: ignore[unpinned-uses] own org reusable, main is PR-only with a canary check
    # with:
    #   node-version: "24.22.1"        # or keep the default node-version-file: .node-version
    #   package-manager: pnpm          # npm (default), pnpm, bun
    #   scripts: lint typecheck test   # package.json scripts that exist are run in this order
    #   extra-commands: npm run test:map -- sample.xml
