name: nuclei

# Reusable post-deploy check of a live URL. Call it from a release workflow after the deploy job:
#   smoke:
#     needs: deploy
#     uses: <org>/.github/.github/workflows/nuclei.yml@<sha>
#     with:
#       url: https://app.example.indicia-ai.com
# Profile `smoke` (default, ~30 s): HTTP templates tagged exposure, misconfig, takeover, unauth,
# disclosure or token at the chosen severities, 100 req/s. Profile `full`: every template, 20 req/s
# (6+ min); the nightly kennisbank sweep covers the full set on the known endpoints.
on:
  workflow_call:
    inputs:
      url:
        description: Live base URL to scan
        required: true
        type: string
      severity:
        description: Severities that fail the job
        required: false
        type: string
        default: high,critical
      profile:
        description: "smoke (post-deploy subset, fast) or full (every template)"
        required: false
        type: string
        default: smoke

permissions: {}

env:
  NUCLEI_VERSION: 3.11.1
  NUCLEI_SHA256: ea63d4ae232808cd7c6bc00d0142428e231fab59dae01042246097d195835ab6
  # Templates are pinned too: with -disable-update-check nuclei never downloads them itself.
  TEMPLATES_VERSION: 10.5.1
  TEMPLATES_SHA256: 30fe1cfaced4635f886e4a2673641bba86998dceec28e468274524e789aa56eb
  SMOKE_TAGS: exposure,misconfig,takeover,unauth,disclosure,token

jobs:
  nuclei:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.profile == 'full' && 20 || 5 }}
    permissions:
      contents: read
    steps:
      - name: Install nuclei
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o nuclei.zip "https://github.com/projectdiscovery/nuclei/releases/download/v${NUCLEI_VERSION}/nuclei_${NUCLEI_VERSION}_linux_amd64.zip"
          echo "${NUCLEI_SHA256}  nuclei.zip" | sha256sum -c -
          unzip -q nuclei.zip nuclei && chmod +x nuclei
          curl -fsSL --retry 3 -o templates.tgz "https://github.com/projectdiscovery/nuclei-templates/archive/refs/tags/v${TEMPLATES_VERSION}.tar.gz"
          echo "${TEMPLATES_SHA256}  templates.tgz" | sha256sum -c -
          mkdir nuclei-templates && tar -xzf templates.tgz -C nuclei-templates --strip-components=1
      - name: Scan
        env:
          TARGET: ${{ inputs.url }}
          SEVERITY: ${{ inputs.severity }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          case "$PROFILE" in
            smoke) args=(-pt http -tags "$SMOKE_TAGS" -rate-limit 100 -concurrency 50) ;;
            full) args=(-rate-limit 20) ;;
            *) echo "::error::Unknown profile '$PROFILE' (smoke or full)"; exit 1 ;;
          esac
          "$RUNNER_TEMP/nuclei" -u "$TARGET" -t "$RUNNER_TEMP/nuclei-templates" -severity "$SEVERITY" "${args[@]}" -silent -disable-update-check -no-interactsh -jsonl -o "$RUNNER_TEMP/nuclei.jsonl"
          if [ -s "$RUNNER_TEMP/nuclei.jsonl" ]; then
            jq -r '"\(.info.severity) \(.["template-id"]) \(.["matched-at"])"' "$RUNNER_TEMP/nuclei.jsonl"
            echo "::error::nuclei found ${SEVERITY} issues on ${TARGET}"
            exit 1
          fi
