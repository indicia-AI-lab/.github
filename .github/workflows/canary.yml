name: canary

# Required check on this repo (ruleset `github-repo-canary`). Every repo calls the reusable workflows here
# on @main, so a merge goes live everywhere at once. This run lints them and calls the PR's own versions
# (./.github/workflows/...) against fixtures in canary/ before the merge.
# release-dokploy.yml cannot run here (it pushes images and deploys); actionlint and zizmor cover it,
# and the first rc tag of campagneplatform after a merge is its live canary.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (workflows and starter templates)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml workflow-templates/*.yml
      - name: zizmor (workflows and starter templates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker run --rm -e GH_TOKEN -v "$PWD:/repo:ro" -w /repo "$ZIZMOR_IMAGE" --format plain .github/workflows workflow-templates

  ci-node:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-node.yml # zizmor: ignore[self-repository] the PR version of this repo is the point
    with:
      working-directory: canary/node
      node-version: "24.22.1"
      lockfile: canary/node/package.json
      install-command: npm install --no-audit --no-fund
      db-image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5

  nuclei:
    permissions:
      contents: read
    uses: ./.github/workflows/nuclei.yml # zizmor: ignore[self-repository] the PR version of this repo is the point
    with:
      url: https://campagneplatform.vps.indicia-ai.com

  # One stable name for the ruleset, whatever jobs are added above.
  canary:
    needs: [lint, ci-node, nuclei]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
