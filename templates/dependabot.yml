# Indicia standard Dependabot config. Copy to .github/dependabot.yml and remove ecosystems the repo does not use.
# Version updates come once a week, grouped per ecosystem, so CI runs once per group instead of once per bump.
# Security updates are on for every repo and stay separate and immediate (groups apply to version updates only).
# The cooldown keeps a freshly published (possibly compromised) release out for 7 days.
# Our own reusable workflows (<org>/.github) are referenced on @main, so there is nothing to bump for them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      production: { dependency-type: production, update-types: [minor, patch] }
      development: { dependency-type: development, update-types: [minor, patch] }
      major: { update-types: [major] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: ["/", "/**"]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      base-images: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      python: { patterns: ["*"], update-types: [minor, patch] }
      python-major: { patterns: ["*"], update-types: [major] }
