# Indicia standard Dependabot config. Copy to .github/dependabot.yml and remove ecosystems the repo does not use.
# Security updates are on for every repo; this adds grouped weekly version updates with a cooldown,
# so a freshly published (possibly compromised) release is not proposed on day one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    open-pull-requests-limit: 5
    groups:
      production: { dependency-type: production, update-types: [minor, patch] }
      development: { dependency-type: development, update-types: [minor, patch] }
  # Also bumps the reusable workflows from indicia-AI-lab/.github (ci-node.yml, release-dokploy.yml, nuclei.yml):
  # SHA + "# vX.Y.Z" comment. Our own refs skip the cooldown and come as one separate PR.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7, exclude: ["indicia-AI-lab/.github*"] }
    groups:
      indicia-workflows: { patterns: ["indicia-AI-lab/.github*"] }
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: ["/", "/**"]
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      base-images: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      python: { patterns: ["*"], update-types: [minor, patch] }
